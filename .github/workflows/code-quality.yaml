name: Code Quality

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'
  merge_group:

jobs:
  phpcs:
    name: PHPCS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Run code quality checks (on push)
        if: github.event_name == 'push'
        run: ./.github/workflows/utilities/phpcs-push ${{ github.sha }}

      - name: Run code quality checks (on pull request)
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        run: ./.github/workflows/utilities/phpcs-pr ${{ github.event.pull_request.base.ref }}

  rector:
    name: Rector
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.1
          coverage: none

      - name: Install Rector
        run: composer install --working-dir=tools --no-interaction --no-progress

      # Rector is a formatter of last resort, not the thing that has to stay
      # green — the test suite is. This only reports whether the code still
      # matches what Rector would write, so a contributor sees it here rather
      # than in a review.
      - name: Check Rector has nothing left to do
        run: tools/vendor/bin/rector process --dry-run
